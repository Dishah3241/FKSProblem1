name = "FKSProblem1"
version = "0.1.0"

# Every target here is a gate. `lake build` alone must be enough to fail a bad tree.
defaultTargets = [
  "FKSProblem1",
  "Challenge",
  "Solution",
  "palomar-compatibility",
  "axioms",
  "fidelity",
  "module-system",
  "standalone-mathlib",
  "proof-links",
  "style",
  "documentation",
  "layering",
]

[leanOptions]
# A typo is a typo, not a new implicit variable.
autoImplicit = false
relaxedAutoImplicit = false
# Mathlib's elaboration-time linters.
weak.linter.mathlibStandardSet = true
# THE important line: this makes `sorry` a build failure rather than a warning, so a tree with an
# unproved leaf cannot be reported as green. Do not set `warn.sorry = false` anywhere.
warningAsError = true

# Pinned to match google-deepmind/formal-conjectures, which is where targets come from. A proof
# developed against the same Mathlib transplants into a `@[formal_proof]` PR without version
# friction. A dependency bump is its own reviewed change, never bundled with mathematics.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

# This glob is AUTHORITATIVE for what is built and audited: every `FKSProblem1/*.lean` compiles
# directly and the audits enumerate the source tree, so an orphaned module still fails the build.
[[lean_lib]]
name = "FKSProblem1"
globs = ["FKSProblem1.*"]

# Palomar's independently compiled statement surface and its proved counterpart.
# `leanblueprint checkdecls` imports every library root into one environment. This module
# repeats the statement declarations, so it cannot be a root next to `Solution`; the glob
# still builds it (Erdos1007, run 20260922-165422-55b65f6c).
[[lean_lib]]
name = "Challenge"
roots = []
globs = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_exe]]
name = "palomar-compatibility"
root = "scripts.PalomarCompatibility"

[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"

# Anti-vacuity battery. See scripts/Fidelity.lean.
[[lean_exe]]
name = "fidelity"
root = "scripts.Fidelity"
supportInterpreter = true

[[lean_exe]]
name = "module-system"
root = "scripts.ModuleSystem"

[[lean_exe]]
name = "standalone-mathlib"
root = "scripts.StandaloneMathlib"

[[lean_exe]]
name = "proof-links"
root = "scripts.ProofLinks"
supportInterpreter = true

[[lean_exe]]
name = "style"
root = "scripts.Style"

[[lean_exe]]
name = "documentation"
root = "scripts.Documentation"

[[lean_exe]]
name = "layering"
root = "scripts.Layering"

# `leanblueprint checkdecls` runs this to verify every `\lean{...}` in blueprint/src/content.tex
# names a declaration that actually exists. It is the drift protection the inline-annotation
# approach gets for free and a LaTeX blueprint does not.
[[require]]
name = "GraphDimension"
git = "https://github.com/Dishah3241/GraphDimension"
rev = "9acc3a712d477b79c3a699c160b20726309eb3c6"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
