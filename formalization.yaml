# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "FKS Problem 1 on at most twice the dimension vertices"
  description: >-
    A Lean-checked proof of FKS Problem 1 for graphs on at most 2d vertices, for every
    d ≥ 4: every finite simple graph of maximum degree at most d with no connected
    component isomorphic to K_{d+1} has an injective placement in Euclidean d-space,
    with every vertex of norm 1/√2 and every edge at distance exactly 1. Non-edges
    are unconstrained and may also have length 1. The unrestricted question is false at
    d = 4: Mishra and Senthilkumar (2026) showed that the square of the nine-cycle, on
    2d + 1 = 9 vertices, has no such placement. The bound proved here is therefore sharp
    at d = 4. Neither result settles the question restricted to d ≥ 5. The exception
    is interpreted componentwise: a K_{d+1} component already precludes such a placement even when
    other components are present. The research audience is discrete geometers and
    extremal graph theorists studying spherical unit-distance representations,
    graph dimension and bounded-degree embedding problems.
  authors: ["Dishant Shah"]
  responsible_maintainers: ["Dishant Shah"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.CO", "math.MG"]
  msc2020: ["05C62", "52C10"]

sources:
  - title: "Embedding graphs in Euclidean space"
    authors: ["Nóra Frankl", "Andrey Kupavskii", "Konrad J. Swanepoel"]
    id: "https://arxiv.org/abs/1802.03092"
    type: "paper"
    location: "J. Combin. Theory Ser. A 171 (2020), 105146; §5, Problem 1"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Source of the open question, not a published proof of the bounded claim.
      The submission proves the restriction to at most 2d vertices using GraphDimension.
      The exception is read componentwise (A40), following the componentwise wording
      immediately before Problem 1. A literal exclusion of only the graph K_{d+1}
      is false for K_{d+1} together with an isolated vertex. The at-most-2d case follows
      from published results (FKS Lemma 13 with Tutte's theorem; or equitable colouring)
      and was found stated nowhere; it is not claimed as new.

related_formalizations:
  - id: "https://github.com/Dishah3241/GraphDimension/tree/db8062bb838b4ac31ea4d5648ea2a8b51685cfa0"
    relationship: "builds-on"
    note: >-
      The proof lives in GraphDimension.Sphere.HalfOrder, declaration
      SimpleGraph.SphereEmbeddable.of_card_le_two_mul. This repository supplies the
      frozen statements, their equivalence, predicate bridges, fidelity companions
      and Palomar entry point. The statement was authored here, not inherited from
      formal-conjectures; the parallel open-statement submission is separate.

status:
  scope: >-
    Problem1Bounded: for every natural d > 3, every graph G on Fin n with n ≤ 2d,
    G.maxDegree ≤ d and no complete component of order d + 1 has an injective spherical
    placement in EuclideanSpace R (Fin d), of radius 1/√2, with every edge at distance 1.
    The unrestricted Problem1 and Problem1At4 are Prop definitions, not admitted
    theorems; both are false (refuted at d = 4 by Mishra and Senthilkumar 2026).
    All fidelity companions are proved. The sole deliberate sorry
    is the advertised hole in Challenge.lean, excluded from the counts below.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "FKSProblem1.Palomar.target"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

fidelity:
  divergences: >-
    The submission adds the vertex bound n ≤ 2d to FKS Problem 1 and does not claim
    the unrestricted question. The source's maximum degree d is read as at most d,
    consistent with its bounded-degree proposition; its exception except K_{d+1}
    is corrected to no K_{d+1} connected component (A40). K_{d+1} together with an
    isolate refutes the literal whole-graph exception; proved separating companions
    certify this distinction. Under the degree bound the component exception is
    equivalent to forbidding a clique of order d + 1. Fin n covers every finite graph
    up to relabelling, including the empty graph; distances and norms are Euclidean L2.
    Statement A uses maximum degree, reachability classes and a norm equation; the
    independently authored Statement B uses neighbor-set cardinalities, component
    isomorphisms and distance from zero. Stage1.Equivalence proves five equivalences,
    including problem1Bounded_iff. The inline Palomar claim agrees definitionally with A.
    The two statement authors shared the brief's intended reading; equivalence checks
    their encodings rather than independently validating that reading.

