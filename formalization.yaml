    family that wrote none of this proof or its library leaves, is saved as
    docs/review-2026-09-29.md: statement faithful, Palomar target right, every gate
    passing; verdict "publish after fixes", both applied. grok is not
    independent here: it wrote GraphDimension's L1/M1 leaves and this repository's
    fidelity companions. The managing agent also contributed fixes and integration.
    The owner's statement sign-off is recorded in docs/compass.md.
