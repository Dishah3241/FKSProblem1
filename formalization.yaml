limitations: >-
  Only the at-most-2d-vertex restriction is proved. The unrestricted problem is false
  at d = 4 (Mishra and Senthilkumar 2026) and unsettled for d ≥ 5. The proved case is not claimed as new.
  Witnesses, separating examples and statement equivalence reduce semantic risk but
  do not replace mathematical review. Local Comparator
  on macOS uses no sandbox. Sandboxed Palomar preflight, the final committed-tree
  verification and publication remain release steps for the manager.

